name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/scripts build tests
      - run: ruff format --check src/scripts build tests

  consistency:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Contrast, names and engine copies
        run: python build/check.py
      - name: Brand reader refuses local and non-web addresses
        run: python src/scripts/brand.py --selftest
      - name: Every font matches its recorded hash
        run: python src/scripts/fonts.py verify
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generated skills match the source
        run: |
          python build/build.py --skip-render
          git diff --exit-code -- skills .claude-plugin
      - name: README matches the themes
        run: |
          python build/readme.py
          git diff --exit-code -- README.md
      - name: Playground page matches the source
        run: |
          python build/site.py --skip-render
          git diff --exit-code -- docs/index.html docs/site/lantern.css docs/site/tokens

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - name: Render a scene in every colour
        working-directory: ${{ runner.temp }}
        run: |
          for c in black white blue purple green red gray teal gold orange cyan rose; do
            python "$GITHUB_WORKSPACE/src/scripts/examples.py" sheet dark "$c"
          done
      - name: Seamless loop
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/src/scripts/examples.py" loop
      - name: Scene library, a social card and a slide template
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/src/scripts/scenes.py" all teal light
          python "$GITHUB_WORKSPACE/src/scripts/social.py" power_grid story orange
          python "$GITHUB_WORKSPACE/src/scripts/deck.py" green --out green.pptx
      - name: Six languages, right to left included
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/src/scripts/examples.py" languages
      - name: Translated scenes and the Persian slide template
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/src/scripts/scenes.py" bank purple fa
          python "$GITHUB_WORKSPACE/src/scripts/scenes.py" bank teal light es
          python "$GITHUB_WORKSPACE/src/scripts/deck.py" purple --lang fa --out fa.pptx
